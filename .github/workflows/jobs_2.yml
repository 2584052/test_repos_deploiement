name: jobs parallèle

on:
  push:
    branches:
      - "test"
jobs:
  build:
    runs-on: macos-14
    steps:
      - run: echo "Build"

  test:
    runs-on: ubuntu-24.04
    needs: build            # Attend que "build" soit terminé
    steps:
      - run: echo "Test"

  deploy:
    runs-on: windows-2022
    needs: [build, test]    # Attend que les deux soient terminés
    steps:
      - run: echo "Deploy"


